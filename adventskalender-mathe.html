<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mathe-Adventskalender</title>
<style>
  :root {
    --bg-top: #fff8ec;
    --bg-bottom: #f3e2bd;
    --card-bg: #fffdf8;
    --ink: #3a2e1f;
    --ink-soft: #7a6a4d;
    --gold: #cf9a2e;
    --gold-light: #a97715;
    --red: #b3382c;
    --green: #3f8f4a;
    --panel-ink: #3a2e1f;
    --lock: #e4dbc2;
    --lock-ink: #9c8f6c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--panel-ink);
  }

  header { display: none; }

  /* ---------- Obere Leiste: Titel, Jahrgangsstufe, Fortschritt, Einstellungen ---------- */
  #top-bar {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    max-width: calc(100vw - 80px);
    display: flex; align-items: center; gap: clamp(6px, 1vw, 12px);
    flex-wrap: wrap;
    justify-content: center;
    background: rgba(255, 253, 248, 0.85);
    backdrop-filter: blur(6px);
    padding: 8px 16px;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    font-size: clamp(0.8rem, 1.3vw, 1rem);
    z-index: 5;
  }
  #top-bar .title-short { font-weight: 800; white-space: nowrap; }
  #top-progress { font-weight: 700; color: var(--ink-soft); white-space: nowrap; }

  .settings-label { font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); margin: 2px 0 6px; }
  #jgst-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .jgst-btn {
    padding: 6px 13px; border-radius: 999px;
    border: 2px solid rgba(58,46,31,0.18);
    background: rgba(58,46,31,0.05);
    color: var(--panel-ink); font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .jgst-btn.active { background: var(--gold); border-color: var(--gold); color: #fffdf8; }

  #settings-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 253, 248, 0.85);
    backdrop-filter: blur(6px);
    color: var(--ink);
    font-size: 1.15rem;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 6;
  }
  #settings-panel {
    position: fixed;
    top: max(58px, calc(env(safe-area-inset-top) + 46px));
    right: max(12px, env(safe-area-inset-right));
    width: min(320px, calc(100vw - 24px));
    background: rgba(255, 253, 248, 0.97);
    border-radius: 16px;
    padding: 16px 18px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    font-size: 0.88rem;
    z-index: 6;
  }
  #settings-panel.hidden { display: none; }
  #settings-panel h2 { margin: 0 0 12px; font-size: 1rem; }
  #testmode-toggle {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 2px dashed rgba(58,46,31,0.3);
    background: rgba(58,46,31,0.04);
    color: var(--ink-soft);
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
    margin-bottom: 10px;
  }
  #testmode-toggle.on { border-color: var(--gold); color: var(--gold-light); background: rgba(207,154,46,0.14); }
  #testmode-toggle input { accent-color: var(--gold); width: 16px; height: 16px; }
  #testmode-banner {
    display: none;
    background: rgba(207,154,46,0.14);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  #testmode-banner.show { display: block; }
  #settings-panel .settings-progress { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 12px; }

  /* ---------- Winterszene mit Tuerchen (ganzseitig) ---------- */
  #hero-stage {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: min(100vw, calc(100vh * (1672 / 941)));
    height: min(100vh, calc(100vw * (941 / 1672)));
    background-size: cover;
    background-position: center;
    container-type: inline-size;
  }
  .door-hero {
    position: absolute;
    width: clamp(20px, 3.3cqw, 56px);
    height: clamp(20px, 3.3cqw, 56px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.85);
    border: 2px solid var(--gold);
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    cursor: pointer;
    color: var(--ink);
    backdrop-filter: blur(2px);
  }
  .door-hero .day-num { font-size: clamp(0.56rem, 1.15cqw, 1.05rem); font-weight: 800; line-height: 1; }
  .door-hero .type-emoji { font-size: clamp(0.4rem, 0.8cqw, 0.78rem); opacity: 0.85; line-height: 1; }
  .door-hero.today { border-width: 3px; animation: pulse-today-hero 1.8s ease-in-out infinite; }
  @keyframes pulse-today-hero {
    0%, 100% { box-shadow: 0 3px 10px rgba(0,0,0,0.35), 0 0 0 0 rgba(212,163,57,0.6); }
    50% { box-shadow: 0 3px 10px rgba(0,0,0,0.35), 0 0 0 7px rgba(212,163,57,0); }
  }
  .door-hero.solved { background: rgba(203,235,209,0.9); border-color: var(--green); }
  .door-hero.solved::after {
    content: "✓";
    position: absolute; top: -4px; right: -4px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--green); color: #fff;
    font-size: 0.62rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .door-hero.locked {
    background: rgba(40,45,55,0.5);
    border-color: rgba(255,255,255,0.45);
    color: #fff;
    cursor: not-allowed;
  }
  .door-hero.locked .type-emoji { display: none; }
  .door-hero.locked .lock-icon { font-size: clamp(0.65rem, 1.2vw, 0.95rem); }

  /* ---------- Modal ---------- */
  #modal-overlay {
    position: fixed; inset: 0;
    background: rgba(58, 46, 31, 0.45);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 40;
  }
  #modal-overlay.show { display: flex; }
  #modal-card {
    background: var(--card-bg);
    color: var(--ink);
    border-radius: 20px;
    padding: clamp(20px, 3vw, 30px);
    width: min(520px, 100%);
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    position: relative;
  }
  #modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: #e5ddc8;
    color: var(--ink);
    font-size: 1.1rem;
    cursor: pointer;
  }
  #modal-day-title { font-size: 1.1rem; font-weight: 800; margin: 0 0 14px; padding-right: 36px; }

  .task-question { font-size: clamp(1rem, 1.7vw, 1.2rem); font-weight: 600; line-height: 1.5; margin-bottom: 14px; }
  .task-question .accent { color: var(--red); font-weight: 800; }

  .task-inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .task-inputs input[type="number"],
  .haus-mini input[type="number"] {
    width: 6.5ch; max-width: 30vw;
    padding: 8px 10px; font-size: 1.1rem;
    border-radius: 10px; border: 2px solid #ccc3ac;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .task-inputs input[type="number"]:focus,
  .haus-mini input[type="number"]:focus { border-color: var(--gold); outline: none; }
  .haus-mini { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
  .haus-mini .box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .haus-mini .box label { font-size: 0.75rem; font-weight: 700; opacity: 0.75; }
  .haus-mini .target { background: var(--gold); color: #2b2109; font-weight: 800; padding: 6px 12px; border-radius: 10px; font-size: 1.05rem; }

  .zahlenstrahl-wrap { margin: 6px 0 16px; }
  .zs-line { position: relative; height: 54px; margin: 0 10px; }
  .zs-track { position: absolute; left: 0; right: 0; top: 28px; height: 3px; background: #ccc3ac; border-radius: 2px; }
  .zs-tick { position: absolute; top: 20px; width: 2px; height: 16px; background: #ccc3ac; }
  .zs-tick.major { top: 14px; width: 3px; height: 28px; background: var(--ink); }
  .zs-label { position: absolute; top: 44px; transform: translateX(-50%); font-size: 0.75rem; font-weight: 700; }
  .zs-marker { position: absolute; top: -16px; transform: translateX(-50%); font-size: 1.3rem; color: var(--red); }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  button.action-btn { padding: 9px 18px; border-radius: 10px; border: none; font-weight: 700; font-size: 0.92rem; cursor: pointer; }
  .btn-check { background: var(--gold); color: #2b2109; }
  .btn-new { background: #e5ddc8; color: var(--ink); }

  .feedback { margin-top: 12px; font-weight: 700; font-size: 0.95rem; display: none; align-items: center; gap: 8px; }
  .feedback.show { display: flex; }
  .feedback.correct { color: var(--green); }
  .feedback.wrong { color: var(--red); }
  .reward-pop { display: inline-block; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }

  .already-solved-note {
    background: rgba(63,143,74,0.12);
    border: 1px solid var(--green);
    color: #2a6b33;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 14px;
  }

</style>
</head>
<body>
<header>
  <h1>🎄 Mathe-Adventskalender</h1>
  <p>24 Türchen voller Matheaufgaben – 1. bis 24. Dezember 2026</p>
</header>

<div id="top-bar">
  <span class="title-short">🎄 Mathe-Adventskalender</span>
  <span id="top-progress">0 / 24</span>
</div>
<button id="settings-btn" title="Einstellungen">⚙</button>
<div id="settings-panel" class="hidden">
  <h2>Einstellungen</h2>
  <div class="settings-progress" id="settings-progress-label">0 / 24 gelöst</div>
  <div class="settings-label">Jahrgangsstufe</div>
  <div id="jgst-row"></div>
  <label id="testmode-toggle"><input type="checkbox" id="testmode-checkbox"> Lehrermodus: alle Türchen offen</label>
  <div id="testmode-banner">⚠️ Lehrermodus aktiv – alle Türchen sind unabhängig vom Datum geöffnet, gelöste Aufgaben zählen hier nicht für den echten Fortschritt</div>
  <button id="reset-progress-btn" class="action-btn btn-new" style="width:100%;">Fortschritt zurücksetzen</button>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_JGST = "adventMatheJgst";
  var STORAGE_TESTMODE = "adventMatheTestmode";
  var STORAGE_SOLVED = "adventMatheSolved";

  var TARGET_YEAR = 2026, TARGET_MONTH = 11; // Dezember = Monat 11 (0-indiziert)

  var ZR_BY_JGST = { 1: 20, 2: 100, 3: 1000, 4: 100000 };
  var NACHBAR_ORDER_BY_JGST = { 1: 1, 2: 10, 3: 100, 4: 1000 };
  var STELLENWERT_DIVISOR_BY_JGST = { 1: 1, 2: 10, 3: 100, 4: 1000 };
  var STELLENWERT_NAME_BY_JGST = { 1: "Einer", 2: "Zehner", 3: "Hunderter", 4: "Tausender" };

  function rand(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }
  function randMultiple(maxMultiplier, step) { return rand(1, maxMultiplier) * step; }

  /* ================= Aufgaben-Generatoren (wie im Prototyp) ================= */

  function buildKopfrechnen(jgst) {
    var zr = ZR_BY_JGST[jgst];
    var isAdd = Math.random() < 0.5;
    var a, b, answer, opSign;
    if (jgst === 4) {
      var step = zr / 100;
      a = randMultiple(90, step);
      b = randMultiple(isAdd ? Math.floor((zr - a) / step) : Math.floor(a / step), step);
    } else {
      a = rand(Math.floor(zr * 0.2), zr - 1);
      b = isAdd ? rand(1, zr - a) : rand(1, a);
    }
    if (isAdd) { answer = a + b; opSign = "+"; } else { answer = a - b; opSign = "−"; }

    return {
      questionHtml: '<span class="accent">' + a.toLocaleString("de-DE") + '</span> ' + opSign + ' <span class="accent">' + b.toLocaleString("de-DE") + '</span> = ?',
      inputsHtml: '<input type="number" class="ans" data-key="result" inputmode="numeric">',
      check: function (container) {
        var v = parseInt(container.querySelector('.ans').value, 10);
        return v === answer;
      }
    };
  }

  function buildZahlenstrahl(jgst) {
    var zr = ZR_BY_JGST[jgst];
    var minorStep = zr / 10;
    var k = rand(1, 9);
    if (k === 5) k = Math.random() < 0.5 ? 4 : 6;
    var target = k * minorStep;
    var majors = [0, zr / 2, zr];

    var ticksHtml = "";
    for (var i = 0; i <= 10; i++) {
      var val = i * minorStep;
      var pct = (val / zr) * 100;
      var isMajor = majors.indexOf(val) >= 0;
      ticksHtml += '<div class="zs-tick' + (isMajor ? " major" : "") + '" style="left:' + pct + '%"></div>';
      if (isMajor) ticksHtml += '<div class="zs-label" style="left:' + pct + '%">' + val.toLocaleString("de-DE") + '</div>';
    }
    var markerPct = (target / zr) * 100;
    ticksHtml += '<div class="zs-marker" style="left:' + markerPct + '%">▲</div>';

    return {
      questionHtml: 'Welche Zahl zeigt der Pfeil?',
      extraHtml: '<div class="zahlenstrahl-wrap"><div class="zs-line"><div class="zs-track"></div>' + ticksHtml + '</div></div>',
      inputsHtml: '<input type="number" class="ans" data-key="result" inputmode="numeric">',
      check: function (container) {
        var v = parseInt(container.querySelector('.ans').value, 10);
        return v === target;
      }
    };
  }

  function buildNachbarzahlen(jgst) {
    var zr = ZR_BY_JGST[jgst];
    var order = NACHBAR_ORDER_BY_JGST[jgst];
    var base = rand(1, Math.floor(zr / order) - 1) * order;
    var offset = rand(1, order - 1);
    var n = order === 1 ? rand(1, zr - 1) : base + offset;
    var lower = order === 1 ? n - 1 : base;
    var upper = order === 1 ? n + 1 : base + order;

    var orderLabel = order === 1 ? "Vorgänger und Nachfolger" :
      "Nachbar" + (order === 10 ? "zehner" : order === 100 ? "hunderter" : "tausender");

    return {
      questionHtml: 'Finde den ' + orderLabel + ' von <span class="accent">' + n.toLocaleString("de-DE") + '</span>.',
      extraHtml: '<div class="haus-mini">' +
        '<div class="box"><label>davor</label><input type="number" class="ans-lower" inputmode="numeric"></div>' +
        '<div class="box"><div class="target">' + n.toLocaleString("de-DE") + '</div></div>' +
        '<div class="box"><label>danach</label><input type="number" class="ans-upper" inputmode="numeric"></div>' +
        '</div>',
      inputsHtml: '',
      check: function (container) {
        var vl = parseInt(container.querySelector('.ans-lower').value, 10);
        var vu = parseInt(container.querySelector('.ans-upper').value, 10);
        return vl === lower && vu === upper;
      }
    };
  }

  function buildStellenwert(jgst) {
    var zr = ZR_BY_JGST[jgst];
    var divisor = STELLENWERT_DIVISOR_BY_JGST[jgst];
    var name = STELLENWERT_NAME_BY_JGST[jgst];
    var number = rand(Math.floor(zr * 0.1), zr - 1);
    var answer = divisor === 1 ? (number % 10) : Math.floor(number / divisor);

    var questionText = divisor === 1
      ? 'Wie viele <strong>' + name + '</strong> stehen an der letzten Stelle von <span class="accent">' + number.toLocaleString("de-DE") + '</span>?'
      : 'Wie viele <strong>' + name + '</strong> stecken in <span class="accent">' + number.toLocaleString("de-DE") + '</span> (Rest zählt nicht mit)?';

    return {
      questionHtml: questionText,
      inputsHtml: '<input type="number" class="ans" data-key="result" inputmode="numeric">',
      check: function (container) {
        var v = parseInt(container.querySelector('.ans').value, 10);
        return v === answer;
      }
    };
  }

  var SACH_TEMPLATES = [
    function (zr) {
      var a = rand(Math.floor(zr * 0.3), zr);
      var b = rand(1, a - 1);
      return { text: 'Der Weihnachtsmann hat <span class="accent">' + a.toLocaleString("de-DE") + '</span> Geschenke gepackt. ' +
        '<span class="accent">' + b.toLocaleString("de-DE") + '</span> davon verteilt er schon am Vormittag. Wie viele Geschenke hat er noch übrig?',
        answer: a - b };
    },
    function (zr) {
      var a = rand(Math.floor(zr * 0.1), Math.floor(zr * 0.6));
      var b = rand(1, zr - a);
      return { text: 'Im Adventskalender sind <span class="accent">' + a.toLocaleString("de-DE") + '</span> Schokostückchen. Oma legt ' +
        '<span class="accent">' + b.toLocaleString("de-DE") + '</span> weitere dazu. Wie viele sind es jetzt insgesamt?',
        answer: a + b };
    },
    function (zr) {
      var kids = rand(2, 6);
      var per = rand(2, Math.max(2, Math.floor(zr / (kids * 3))));
      var total = kids * per;
      return { text: '<span class="accent">' + total.toLocaleString("de-DE") + '</span> Plätzchen werden gleichmäßig an ' +
        '<span class="accent">' + kids + '</span> Kinder verteilt. Wie viele Plätzchen bekommt jedes Kind?',
        answer: per };
    }
  ];
  function buildSachaufgabe(jgst) {
    var zr = ZR_BY_JGST[jgst];
    var tmpl = SACH_TEMPLATES[rand(0, SACH_TEMPLATES.length - 1)];
    var t = tmpl(zr);
    return {
      questionHtml: t.text,
      inputsHtml: '<input type="number" class="ans" data-key="result" inputmode="numeric">',
      check: function (container) {
        var v = parseInt(container.querySelector('.ans').value, 10);
        return v === t.answer;
      }
    };
  }

  function buildKnobel(jgst) {
    var stepRanges = { 1: [1, 3], 2: [5, 10], 3: [50, 100], 4: [1000, 5000] };
    var r = stepRanges[jgst];
    var step = rand(r[0], r[1]);
    var countUp = Math.random() < 0.7;
    var startMax = Math.max(1, ZR_BY_JGST[jgst] - step * 5);
    var start = rand(0, startMax);
    var seq = [];
    for (var i = 0; i < 4; i++) seq.push(countUp ? start + i * step : start + (4 - i) * step);
    var answer = countUp ? (seq[3] + step) : (seq[3] - step);

    return {
      questionHtml: 'Wie geht die Reihe weiter? ' + seq.map(function (v) { return v.toLocaleString("de-DE"); }).join(" , ") + ' , ?',
      inputsHtml: '<input type="number" class="ans" data-key="result" inputmode="numeric">',
      check: function (container) {
        var v = parseInt(container.querySelector('.ans').value, 10);
        return v === answer;
      }
    };
  }

  var TASK_TYPES = [
    { id: "kopfrechnen", label: "Kopfrechnen", emoji: "🧮", build: buildKopfrechnen },
    { id: "zahlenstrahl", label: "Zahlenstrahl", emoji: "📏", build: buildZahlenstrahl },
    { id: "nachbarzahlen", label: "Nachbarzahlen", emoji: "🏠", build: buildNachbarzahlen },
    { id: "stellenwert", label: "Stellenwert", emoji: "🔢", build: buildStellenwert },
    { id: "sachaufgabe", label: "Sachaufgabe", emoji: "🎁", build: buildSachaufgabe },
    { id: "knobelaufgabe", label: "Knobelaufgabe", emoji: "🧩", build: buildKnobel }
  ];

  var DAY_TYPE_PERMS = [
    [0, 1, 2, 3, 4, 5],
    [2, 4, 0, 5, 1, 3],
    [5, 0, 3, 1, 4, 2],
    [1, 3, 5, 2, 0, 4]
  ];
  function typeForDay(day) {
    var cycle = Math.floor((day - 1) / 6);
    var pos = (day - 1) % 6;
    return TASK_TYPES[DAY_TYPE_PERMS[cycle][pos]];
  }

  /* ================= Status / Speicherung ================= */

  function safeGet(key, fallback) {
    try { var v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }

  var currentJgst = parseInt(safeGet(STORAGE_JGST, "2"), 10);
  if (!(currentJgst >= 1 && currentJgst <= 4)) currentJgst = 2;

  var testMode = safeGet(STORAGE_TESTMODE, null);
  testMode = testMode === null ? true : testMode === "1";

  var solvedDays = {};
  try {
    var stored = JSON.parse(safeGet(STORAGE_SOLVED, "{}"));
    if (stored && typeof stored === "object") solvedDays = stored;
  } catch (e) { solvedDays = {}; }

  function persistSolved() { safeSet(STORAGE_SOLVED, JSON.stringify(solvedDays)); }

  function todayDay() {
    var now = new Date();
    if (now.getFullYear() === TARGET_YEAR && now.getMonth() === TARGET_MONTH && now.getDate() >= 1 && now.getDate() <= 24) {
      return now.getDate();
    }
    return null;
  }
  function isUnlocked(day) {
    if (testMode) return true;
    var now = new Date();
    var doorDate = new Date(TARGET_YEAR, TARGET_MONTH, day, 0, 0, 0);
    return now >= doorDate;
  }

  /* ================= UI ================= */

  var jgstRow = document.getElementById("jgst-row");
  var heroDoors = document.getElementById("hero-doors");

  var DOOR_POSITIONS = (function () {
    var skyX = [4, 18, 32, 46], skyY = [10, 20, 30];
    var snowX = [2, 14, 26, 38], snowY = [72, 83, 94];
    var points = [];
    skyY.forEach(function (y) { skyX.forEach(function (x) { points.push({ x: x, y: y }); }); });
    snowY.forEach(function (y) { snowX.forEach(function (x) { points.push({ x: x, y: y }); }); });
    return points;
  })();
  var testmodeToggle = document.getElementById("testmode-toggle");
  var testmodeCheckbox = document.getElementById("testmode-checkbox");
  var testmodeBanner = document.getElementById("testmode-banner");
  var topProgress = document.getElementById("top-progress");
  var settingsProgressLabel = document.getElementById("settings-progress-label");
  var settingsBtn = document.getElementById("settings-btn");
  var settingsPanel = document.getElementById("settings-panel");
  var modalOverlay = document.getElementById("modal-overlay");
  var modalCard = document.getElementById("modal-card");
  var modalClose = document.getElementById("modal-close");
  var modalDayTitle = document.getElementById("modal-day-title");
  var modalBody = document.getElementById("modal-body");

  var currentOpenDay = null;

  function buildJgstRow() {
    jgstRow.innerHTML = "";
    for (var j = 1; j <= 4; j++) {
      (function (jgst) {
        var btn = document.createElement("button");
        btn.className = "jgst-btn" + (jgst === currentJgst ? " active" : "");
        btn.textContent = "Jgst " + jgst;
        btn.addEventListener("click", function () {
          currentJgst = jgst;
          safeSet(STORAGE_JGST, String(jgst));
          Array.prototype.forEach.call(jgstRow.children, function (b, idx) {
            b.classList.toggle("active", idx === jgst - 1);
          });
          if (currentOpenDay !== null) openDoor(currentOpenDay);
        });
        jgstRow.appendChild(btn);
      })(j);
    }
  }

  function updateTestmodeUI() {
    testmodeCheckbox.checked = testMode;
    testmodeToggle.classList.toggle("on", testMode);
    testmodeBanner.classList.toggle("show", testMode);
  }
  testmodeCheckbox.addEventListener("change", function () {
    testMode = testmodeCheckbox.checked;
    safeSet(STORAGE_TESTMODE, testMode ? "1" : "0");
    updateTestmodeUI();
    buildDoorGrid();
  });

  document.getElementById("reset-progress-btn").addEventListener("click", function () {
    if (!window.confirm("Wirklich den gesamten Fortschritt (alle gelösten Türchen) zurücksetzen?")) return;
    solvedDays = {};
    persistSolved();
    updateProgress();
    buildDoorGrid();
  });

  settingsBtn.addEventListener("click", function () { settingsPanel.classList.toggle("hidden"); });

  function updateProgress() {
    var count = Object.keys(solvedDays).filter(function (k) { return solvedDays[k]; }).length;
    topProgress.textContent = count + " / 24";
    settingsProgressLabel.textContent = count + " / 24 gelöst";
  }

  function buildDoorGrid() {
    heroDoors.innerHTML = "";
    var today = todayDay();
    for (var day = 1; day <= 24; day++) {
      (function (day) {
        var type = typeForDay(day);
        var unlocked = isUnlocked(day);
        var solved = !!solvedDays[day];
        var pos = DOOR_POSITIONS[day - 1];
        var div = document.createElement("div");
        div.className = "door-hero" + (unlocked ? "" : " locked") + (solved ? " solved" : "") + (today === day && !solved ? " today" : "");
        div.style.left = pos.x + "%";
        div.style.top = pos.y + "%";
        div.innerHTML = unlocked
          ? '<span class="day-num">' + day + '</span><span class="type-emoji">' + type.emoji + '</span>'
          : '<span class="day-num">' + day + '</span><span class="lock-icon">🔒</span>';
        if (unlocked) {
          div.addEventListener("click", function () { openDoor(day); });
        }
        heroDoors.appendChild(div);
      })(day);
    }
  }

  function openDoor(day) {
    currentOpenDay = day;
    var type = typeForDay(day);
    var task = type.build(currentJgst);
    var alreadySolved = !!solvedDays[day];

    modalDayTitle.textContent = day + ". Dezember – " + type.label;
    modalBody.innerHTML =
      (alreadySolved ? '<div class="already-solved-note">✓ Dieses Türchen wurde schon gelöst. Du kannst gerne weiterüben.</div>' : "") +
      '<div class="task-question">' + task.questionHtml + '</div>' +
      (task.extraHtml || "") +
      '<div class="task-inputs">' + task.inputsHtml + '</div>' +
      '<div class="btn-row">' +
      '<button class="action-btn btn-check">Prüfen</button>' +
      '<button class="action-btn btn-new">Neue Aufgabe</button>' +
      '</div>' +
      '<div class="feedback"></div>';

    modalBody.querySelector(".btn-check").addEventListener("click", function () {
      var ok = task.check(modalBody);
      var fb = modalBody.querySelector(".feedback");
      fb.className = "feedback show " + (ok ? "correct" : "wrong");
      if (ok) {
        if (testMode) {
          fb.innerHTML = '<span class="reward-pop">⭐</span> Richtig gelöst! (Lehrermodus: zählt nicht für den echten Fortschritt)';
        } else {
          fb.innerHTML = '<span class="reward-pop">⭐</span> Richtig gelöst!';
          if (!solvedDays[day]) {
            solvedDays[day] = true;
            persistSolved();
            updateProgress();
            buildDoorGrid();
          }
        }
      } else {
        fb.textContent = 'Noch nicht ganz richtig – versuch es weiter oder klicke auf "Neue Aufgabe".';
      }
    });
    modalBody.querySelector(".btn-new").addEventListener("click", function () { openDoor(day); });

    modalOverlay.classList.add("show");
  }

  function closeModal() {
    modalOverlay.classList.remove("show");
    currentOpenDay = null;
  }
  modalClose.addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", function (e) { if (e.target === modalOverlay) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  buildJgstRow();
  updateTestmodeUI();
  updateProgress();
  buildDoorGrid();
})();
</script>
</body>
</html>
