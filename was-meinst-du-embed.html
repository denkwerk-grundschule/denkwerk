<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Was meinst du? Kleine Fragen. Große Gedanken. (16:9)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #f3ead9;
    overflow: hidden;
  }
  .frame {
    width: 100%;
    height: 100%;
    aspect-ratio: 16 / 9;
    max-height: 100vh;
    max-width: 177.78vh;
    margin: 0 auto;
    background: #f3ead9;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .bar {
    flex: 0 0 auto;
    width: 100%;
  }
  .bar-top { height: 5.5%; background: #4c9a5b; }
  .bar-bottom { height: 5.5%; background: #e08a2b; }
  .viewport {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3ead9;
  }
  iframe {
    border: 0;
    display: block;
    background: #f4f1ea;
    width: 1600px;
    height: 800px;
    flex: 0 0 auto;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="bar bar-top"></div>
    <div class="viewport" id="viewport">
      <iframe id="app-frame" src="was-meinst-du.html" title="Was meinst du? Kleine Fragen. Große Gedanken." allow="fullscreen"></iframe>
    </div>
    <div class="bar bar-bottom"></div>
  </div>

<script>
  (function () {
    // Die Kartei füllt immer den ganzen Bildschirm aus und scrollt
    // in der Übersicht selbst. Deshalb bekommt sie hier eine feste Fläche,
    // die passend zum Rahmen skaliert wird.
    var NATIVE_W = 1600;
    var NATIVE_H = 800;
    var viewport = document.getElementById('viewport');
    var iframe = document.getElementById('app-frame');

    function fit() {
      var vw = viewport.clientWidth;
      var vh = viewport.clientHeight;
      var scale = Math.min(vw / NATIVE_W, vh / NATIVE_H);
      iframe.style.transform = 'scale(' + scale + ')';
      iframe.style.transformOrigin = 'center center';
    }

    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
